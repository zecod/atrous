# A release of Atrous: push a tag `v<version>` matching Cargo.toml (and
# core/crates/atrous-core/Cargo.toml: one version). Each platform builds and
# packs the app with its core inside (scripts/package: one archive per
# platform); then everything goes to the GitHub release v<version> of this
# repo, published only once every file is uploaded, so nobody sees a version
# whose files aren't there yet.
#
# Caches: a tag's own cache is visible only to that tag, so tags restore
# master's. Master keeps them warm by building (without publishing) when
# what the build depends on changes: Cargo.lock, the vendored crates, the
# toolchain, this workflow. Let that run finish before tagging.
#
# The cache is the whole target/, with scripts/ci-sources keeping unchanged
# files fresh to Cargo: the vendored crates (gpui-kit, taffy, ghostty) are
# the slow part, and a fresh checkout would otherwise rebuild them all.
#
# Tests (the native screenshot test too) run only in ci.yml: a tag publishes
# once ci.yml has passed for its commit.
name: build and release
# Master pushes only build (to keep the cache warm); tags publish.
run-name: ${{ github.ref_type == 'tag' && format('release {0}', github.ref_name) || format('build {0}', github.ref_name) }}

on:
  push:
    tags: ["v*"]
    branches: [master]
    paths:
      - Cargo.lock
      - Cargo.toml
      - vendor/**
      - crates/**
      - core/Cargo.lock
      - core/Cargo.toml
      - core/crates/**
      - core/vendor/**
      - core/scripts/mac-bundle
      - core/scripts/mac-sign
      - core/scripts/fetch-conpty.ps1
      - scripts/package
      - scripts/stage-core
      - scripts/notices.*
      - tests/notices.rs
      - about.toml
      - licenses/**
      - LICENSE
      - THIRD-PARTY-NOTICES
      - scripts/mac-sign
      - scripts/macos-entitlements.plist
      - scripts/mac-dmg
      - distribution/macos/dmg/**
      - scripts/ci-sources
      - .github/workflows/release.yml
  # Builds only; publishing needs a tag.
  workflow_dispatch:

permissions:
  contents: read

# Never cancel: a cancelled master build saves no cache, a cancelled tag no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.95.0
  # In the cache key: ghostty-sys can't tell when Zig changes.
  ZIG_VERSION: 0.16.0
  IS_TAG: ${{ github.ref_type == 'tag' }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux on the oldest Ubuntu we can: the app links the system's
          # glibc, so this sets how old a distro it runs on.
          - { target: linux-x86_64, runner: ubuntu-22.04 }
          - { target: linux-aarch64, runner: ubuntu-22.04-arm }
          - { target: macos-aarch64, runner: macos-15 }
          - { target: windows-x86_64, runner: windows-2022 }
    runs-on: ${{ matrix.runner }}
    # Only tags can access the release environment's Apple certificate.
    environment: ${{ github.ref_type == 'tag' && 'release' || 'build' }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Restore build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &cache-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            core/target
          key: release-v3-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock', 'core/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            release-v3-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock', 'core/Cargo.lock') }}-
            release-v3-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # A stuck package mirror fails here in minutes, not at the job's limit.
        timeout-minutes: 10
        run: |
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt update
          sudo apt-get $apt install -y --no-install-recommends \
            pkg-config clang libclang-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev
      # bindgen's libclang: the runner image's LLVM.
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - name: Version matches the tag
        if: env.IS_TAG == 'true'
        run: |
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $want"; exit 1; }
          core="v$(sed -n 's/^version = "\(.*\)"/\1/p' core/crates/atrous-core/Cargo.toml | head -1)"
          [ "$core" = "$want" ] || { echo "the core is $core, the app $want: one version for both"; exit 1; }
      - name: Keep unchanged sources fresh
        run: scripts/ci-sources restore
      - name: Build and pack
        env:
          RELEASES_URL: ${{ vars.RELEASES_URL }}
          APPLE_CERTIFICATE_P12: ${{ runner.os == 'macOS' && github.ref_type == 'tag' && secrets.APPLE_CERTIFICATE_P12 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && github.ref_type == 'tag' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
        run: scripts/package
      - name: Verify release notices
        run: |
          archive="dist/atrous-${{ matrix.target }}.tar.gz"
          if [[ '${{ runner.os }}' == macOS ]]; then
            prefix=Atrous.app/Contents/Resources
          else
            prefix=atrous
          fi
          tar -xOf "$archive" "$prefix/THIRD-PARTY-NOTICES" | cmp - THIRD-PARTY-NOTICES
          tar -xOf "$archive" "$prefix/LICENSE" | cmp - LICENSE
      - name: Note the sources the cache was built from
        if: github.ref == 'refs/heads/master'
        run: scripts/ci-sources record
      - name: Save build cache
        if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cache-paths
          key: release-v3-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock', 'core/Cargo.lock') }}-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atrous-${{ matrix.target }}
          path: dist/atrous-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ci.yml runs when the tagged commit reaches master; wait for its result.
  # A newer push cancels it: rerun it and this job carries on.
  ci-passed:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
    steps:
      - name: Wait for ci on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while :; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion) \(.id)"') || run="api error"
            echo "ci for $GITHUB_SHA: $run"
            case "$run" in
              "completed success "*) exit 0 ;;
              "completed cancelled "*) echo "cancelled by a newer push: rerun that ci run, this job keeps waiting" ;;
              completed*) exit 1 ;;
            esac
            sleep 30
          done

  # Signs atrous.exe with Azure Artifact Signing and repacks it, on the repo
  # owner's tag pushes and manual runs (to test signing without publishing).
  # Azure trusts only jobs in the signing environment. The Azure IDs and the
  # signing account are signing environment variables; the certificate profile
  # is a repository variable (job-level `if` can't see environment ones), and
  # while it's unset this is skipped and releases go out unsigned.
  sign-windows:
    needs: build
    if: >-
      github.triggering_actor == github.repository_owner && vars.AZURE_SIGNING_PROFILE != ''
      && ((github.event_name == 'push' && github.ref_type == 'tag') || github.event_name == 'workflow_dispatch')
    environment: signing
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atrous-windows-x86_64
          path: dist
      - run: tar -xzf dist/atrous-windows-x86_64.tar.gz -C dist
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\dist\atrous\atrous.exe
            ${{ github.workspace }}\dist\atrous\atrous-core.exe
          description: Atrous
          description-url: https://github.com/zecod/atrous
      - name: Check the signature
        shell: pwsh
        run: |
          foreach ($exe in "atrous.exe", "atrous-core.exe") {
            $sig = Get-AuthenticodeSignature "dist\atrous\$exe"
            $sig | Format-List Status, StatusMessage, SignerCertificate
            if ($sig.Status -ne 'Valid') { exit 1 }
          }
          # atc.exe is the same file as atrous-core.exe: the signed one.
          Remove-Item dist\atrous\atc.exe
          New-Item -ItemType HardLink -Path dist\atrous\atc.exe -Target dist\atrous\atrous-core.exe | Out-Null
      - run: tar -czf dist/atrous-windows-x86_64.tar.gz -C dist atrous
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atrous-windows-x86_64
          path: dist/atrous-windows-x86_64.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The GitHub release v<version>: created as a draft, every file uploaded,
  # then published, so `releases/latest/download/manifest.json` (what installed
  # apps and the installers read) never points at a version whose files
  # aren't there yet.
  publish:
    needs: [build, sign-windows, ci-passed]
    # Only a tag push by the repo owner publishes: anyone with write access can
    # re-run an old tag's run. sign-windows may be skipped, not failed.
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.sign-windows.result != 'failure'
      && needs.ci-passed.result == 'success'
      && github.event_name == 'push' && github.ref_type == 'tag' && github.triggering_actor == github.repository_owner
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Manifest and notes
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          core=$(tr -d '[:space:]' < distribution/core-version)
          python3 - "$version" "$core" <<'PY'
          import hashlib, json, pathlib, sys, os
          version, core = sys.argv[1], sys.argv[2]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/v{version}"
          targets = {}
          for f in sorted(pathlib.Path("dist").glob("atrous-*.tar.gz")):
              t = f.name.removeprefix("atrous-").removesuffix(".tar.gz")
              targets[t] = {"url": f"{base}/{f.name}", "sha256": hashlib.sha256(f.read_bytes()).hexdigest()}
          # core_min: the oldest core this app works with.
          doc = {"version": version, "core_min": core, "notes": f"Atrous {version}", "targets": targets}
          pathlib.Path("dist/manifest.json").write_text(json.dumps(doc, indent=2) + "\n")
          print(json.dumps(doc, indent=2))
          # This version's section of the changelog, as the release's notes.
          text = pathlib.Path("CHANGELOG.md").read_text()
          section = text.split(f"## [{version}]", 1)[1].split("\n## [", 1)[0]
          pathlib.Path("dist/notes.md").write_text(section.split("\n", 1)[1].strip() + "\n")
          PY
          cp CHANGELOG.md dist/changelog.md
          cp distribution/install.sh distribution/install.ps1 dist/
      - name: Release
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          gh release create "v$version" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Atrous $version" --notes-file dist/notes.md
          gh release upload "v$version" --repo "$GITHUB_REPOSITORY" \
            dist/atrous-*.tar.gz dist/manifest.json dist/changelog.md dist/install.sh dist/install.ps1
          gh release edit "v$version" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  # The drag-and-drop download, added to the published release; never holds
  # up update publishing above.
  mac-dmg:
    needs: [build, ci-passed, publish]
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.triggering_actor == github.repository_owner
    environment: release
    runs-on: macos-15
    timeout-minutes: 40
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atrous-macos-aarch64
          path: dist
      - name: Install DMG tools
        run: brew install create-dmg jq
      - name: Build, sign, notarize and verify DMG
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          tar -xzf dist/atrous-macos-aarch64.tar.gz -C dist
          scripts/mac-dmg dist/Atrous.app dist/Atrous.dmg
      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/Atrous.dmg --clobber
