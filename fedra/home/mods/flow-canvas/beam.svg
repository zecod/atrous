<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- A quarter wedge with a fading tail: spun behind an element, it shows as a beam of light
       running around the element's edge (only a thin ring of it is left uncovered). -->
  <defs>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <path d="M50 50 L50 0 A50 50 0 0 1 100 50 Z" fill="url(#tail)"/>
</svg>
