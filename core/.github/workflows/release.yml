# A release: push a tag `v<version>` matching crates/atrous-core/Cargo.toml.
# Five builds: Linux x86_64/aarch64, macOS x86_64/aarch64, and Windows x86_64.
# Linux uses static musl for compatibility with older distros.
# Publishes a GitHub release of this repository (zecod/atrous-core) holding the
# archives, manifest.json and both installers; `atc update` and the installers
# read releases/latest/download/manifest.json. The release is created as a
# draft and made public only once every file is up.
name: release

on:
  push:
    tags: ["v*"]
  # Builds only; publishing needs a tag.
  workflow_dispatch:

permissions:
  contents: read

# Never cancel: a cancelled tag run is a half release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.95.0
  IS_TAG: ${{ github.ref_type == 'tag' }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { name: linux-aarch64, target: aarch64-unknown-linux-musl, runner: ubuntu-22.04-arm }
          - { name: macos-aarch64, target: aarch64-apple-darwin, runner: macos-15 }
          # Cross-build on Apple Silicon; verify the Intel binary under Rosetta.
          - { name: macos-x86_64, target: x86_64-apple-darwin, runner: macos-15 }
          - { name: windows-x86_64, target: x86_64-pc-windows-msvc, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    # Only tag pushes can use the release environment's Apple certificate.
    environment: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'release' || 'build' }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}-release
          cache-workspace-crates: true
          cache-bin: false
          # Tags can't share their caches; only manual builds on main save one.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Version matches the tag
        if: env.IS_TAG == 'true'
        run: |
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' crates/atrous-core/Cargo.toml | head -1)"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $want"; exit 1; }
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p atrous-core
      - name: Assemble macOS bundle
        if: runner.os == 'macOS'
        run: sh scripts/mac-bundle target/${{ matrix.target }}/release/atrous-core 'target/${{ matrix.target }}/release/Atrous Core.app'
      - name: Sign macOS bundle and standalone executable
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.APPLE_CERTIFICATE_P12 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
        # Without the certificate secrets mac-sign signs ad-hoc (Atrous has no
        # Developer ID yet); atrous-core accepts that for its identifier.
        run: |
          scripts/mac-sign 'target/${{ matrix.target }}/release/Atrous Core.app'
          scripts/mac-sign 'target/${{ matrix.target }}/release/atrous-core'
      - name: Notarize macOS bundle and standalone executable
        if: runner.os == 'macOS' && github.event_name == 'push' && github.ref_type == 'tag'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # Notarizing needs a Developer ID signature: skipped without its key.
        run: |
          if [ -z "$APPLE_API_KEY" ]; then echo "no notary key: not notarized"; exit 0; fi
          bash scripts/mac-notarize 'target/${{ matrix.target }}/release/Atrous Core.app'
          bash scripts/mac-notarize 'target/${{ matrix.target }}/release/atrous-core'
      - name: Pack
        if: runner.os != 'Windows'
        run: |
          bin=target/${{ matrix.target }}/release/atrous-core
          "$bin" --version # it runs on its own platform
          if [ "${{ runner.os }}" = Linux ]; then file "$bin" | grep -q 'static' || { file "$bin"; echo "not static"; exit 1; }; fi
          mkdir -p dist
          if [ "${{ runner.os }}" = macOS ]; then bin="$(dirname "$bin")/Atrous Core.app"; fi
          sh scripts/package "$bin" dist/atrous-core-${{ matrix.name }}.tar.gz
      # Windows: a zip of the exe, Microsoft's ConPTY (Windows' own swallows
      # answers to programs) and its notices. Zipped by Windows' tar, which
      # is also what unpacks it.
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/atrous-core.exe"
          & $bin --version
          if ($LASTEXITCODE) { throw "it does not run" }
          # A clean Windows has no Visual C++ runtime.
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($bin)).ToLower()
          foreach ($dll in "vcruntime140", "msvcp140", "api-ms-win-crt-") { if ($text.Contains($dll)) { throw "atrous-core.exe imports $dll" } }
          New-Item -ItemType Directory -Force stage/THIRD-PARTY-NOTICES, dist | Out-Null
          Copy-Item $bin stage/
          Copy-Item LICENSE stage/
          Copy-Item crates/atrous-core/THIRD-PARTY-NOTICES stage/THIRD-PARTY-NOTICES/atrous-core.txt
          scripts/fetch-conpty.ps1 -Dest stage
          Copy-Item distribution/windows/* stage/THIRD-PARTY-NOTICES/
          tar -a -cf dist/atrous-core-${{ matrix.name }}.zip -C stage atrous-core.exe conpty LICENSE THIRD-PARTY-NOTICES
          if ($LASTEXITCODE) { throw "zip failed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atrous-core-${{ matrix.name }}
          path: dist/atrous-core-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASES_URL: https://github.com/${{ github.repository }}/releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Manifest
        run: |
          version=${GITHUB_REF_NAME#v}
          export NOTES="$(awk -v heading="## [$version] - " 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found && /^- / { sub(/^- /, ""); print; exit }' CHANGELOG.md)"
          scripts/manifest dist > dist/manifest.json && cat dist/manifest.json
      - name: Release
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v heading="## [$version] - " 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > dist/notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "atrous-core $version" --notes-file dist/notes.md \
            dist/atrous-core-*.tar.gz dist/atrous-core-*.zip dist/manifest.json distribution/install.sh distribution/install.ps1
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
